<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA SATVISION — Geospatial Anomaly Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070a13;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(56, 189, 248, 0.15);
            --cyan: #38bdf8;
            --red: #f87171;
            --amber: #fbbf24;
            --green: #4ade80;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #0f1c3f 0%, var(--bg) 75%);
            color: var(--text-main);
            margin: 0;
            padding: 30px 24px;
            min-height: 100vh;
        }
        .container { max-width: 1240px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .control-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: flex-end;
        }
        .file-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .file-box label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="file"] {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="file"]:hover { border-color: var(--cyan); }
        .btn-scan {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #030712;
            font-weight: 800;
            border: none;
            padding: 13px 32px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
        }
        .btn-scan:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); 
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
            display: none;
        }
        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }
        .metric-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .metric-card b {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.7rem;
            font-weight: 700;
        }
        .display-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.25fr;
            gap: 20px;
        }
        .img-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
        }
        .img-card h4 {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .img-container {
            width: 100%;
            height: 340px;
            border-radius: 10px;
            background: #020617;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .placeholder-text {
            color: #475569;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .report-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 22px;
            margin-top: 28px;
            display: none;
        }
        .report-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--cyan);
        }
        .report-box p {
            margin: 0;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <h1>🛰️ SATVISION</h1>
            <span style="color: var(--text-muted); font-size: 0.85rem;">// AUTONOMOUS ANOMALY SCAN</span>
        </div>
        <div class="badge">by Calypso</div>
    </header>

    <div class="control-panel">
        <div class="upload-row">
            <div class="file-box">
                <label>Baseline Image (Before Event)</label>
                <input type="file" id="beforeInput" accept="image/*" onchange="previewFile('beforeInput', 'imgBefore', 'phBefore')">
            </div>
            <div class="file-box">
                <label>Target Scan (After Event)</label>
                <input type="file" id="afterInput" accept="image/*" onchange="previewFile('afterInput', 'imgAfter', 'phAfter')">
            </div>
            <button class="btn-scan" onclick="runAnalysis()">Run Intelligence Scan</button>
        </div>
    </div>

    <div class="metrics-grid" id="metricsBar">
        <div class="metric-card">
            <span>Surface Delta</span>
            <b id="mChange" style="color: var(--cyan);">0%</b>
        </div>
        <div class="metric-card">
            <span>Primary Cause</span>
            <b id="mThreat" style="color: var(--amber); font-size: 1.05rem;">-</b>
        </div>
        <div class="metric-card">
            <span>Man-Made Sites</span>
            <b id="mHuman" style="color: var(--red);">0</b>
        </div>
        <div class="metric-card">
            <span>Disrupted Area</span>
            <b id="mArea" style="color: var(--green);">0 km²</b>
        </div>
    </div>

    <div class="display-grid">
        <div class="img-card">
            <h4>Baseline (Before)</h4>
            <div class="img-container">
                <span class="placeholder-text" id="phBefore">[ No Image Loaded ]</span>
                <img id="imgBefore">
            </div>
        </div>
        <div class="img-card">
            <h4>Target Scan (After)</h4>
            <div class="img-container">
                <span class="placeholder-text" id="phAfter">[ No Image Loaded ]</span>
                <img id="imgAfter">
            </div>
        </div>
        <div class="img-card">
            <h4>Attribution Overlay</h4>
            <div class="img-container">
                <span class="placeholder-text" id="phResult">[ Awaiting Scan ]</span>
                <img id="imgResult">
            </div>
        </div>
    </div>

    <div class="report-box" id="reportCard">
        <h3>Autonomous Satellite Intelligence Report</h3>
        <p id="reportText"></p>
    </div>
</div>

<script>
    function previewFile(inputId, imgId, phId) {
        const file = document.getElementById(inputId).files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById(phId).style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    function renderOutput(data) {
        document.getElementById('imgBefore').src = data.before_img;
        document.getElementById('imgBefore').style.display = 'block';
        document.getElementById('phBefore').style.display = 'none';

        document.getElementById('imgAfter').src = data.after_img;
        document.getElementById('imgAfter').style.display = 'block';
        document.getElementById('phAfter').style.display = 'none';

        document.getElementById('imgResult').src = data.result_img;
        document.getElementById('imgResult').style.display = 'block';
        document.getElementById('phResult').style.display = 'none';

        document.getElementById('mChange').innerText = data.metrics.change_percentage + '%';
        document.getElementById('mThreat').innerText = data.metrics.primary_threat;
        document.getElementById('mHuman').innerText = data.metrics.human_clusters;
        document.getElementById('mArea').innerText = data.metrics.disrupted_km2 + ' km²';

        document.getElementById('reportText').innerHTML = 
            `<strong>Attribution Verdict:</strong> ${data.metrics.primary_threat} (Model Confidence: ${data.metrics.confidence}).<br>` +
            `Computer vision scan isolated <strong>${data.metrics.human_clusters} anthropogenic sites</strong> (red bounds) ` +
            `and <strong>${data.metrics.natural_clusters} environmental variance zones</strong> (amber bounds). ` +
            `Estimated total surface disruption footprint: <strong>${data.metrics.disrupted_km2} km²</strong>. Autonomous verification complete.`;

        document.getElementById('metricsBar').style.display = 'grid';
        document.getElementById('reportCard').style.display = 'block';
    }

    async function runAnalysis() {
        const b = document.getElementById('beforeInput').files[0];
        const a = document.getElementById('afterInput').files[0];
        if (!b || !a) {
            alert('Please select both Baseline and Target images before scanning.');
            return;
        }
        const fd = new FormData();
        fd.append('before_file', b);
        fd.append('after_file', a);

        try {
            const res = await fetch('/api/scan', { method: 'POST', body: fd });
            const data = await res.json();
            renderOutput(data);
        } catch(err) {
            console.error(err);
            alert('Scan pipeline error. Ensure backend is active.');
        }
    }
</script>
</body>
</html>
